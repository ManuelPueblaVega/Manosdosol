<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manos Do-Mi-Sol</title>
    
    <!-- Librerías p5.js y ml5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    
    <!-- Estilos CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            overflow: hidden; /* Evita barras de scroll innecesarias */
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 700;
            margin: 0;
        }

        h2 {
            font-size: 1.2rem;
            color: #bb86fc; /* Un morado vibrante */
            font-weight: 400;
            margin: 0.5rem 0 0 0;
        }

        #canvas-container {
            position: relative;
            width: 640px;
            max-width: 95vw; /* Asegura que se ajuste en pantallas pequeñas */
            height: 480px;
            max-height: 70vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }
        
        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #status-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 1rem 2rem;
            border-radius: 10px;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }
        
        #hand-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(187, 134, 252, 0.85);
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            transition: background-color 0.3s ease;
        }

        footer {
            position: absolute;
            bottom: 15px; /* Ajustado para más espacio */
            width: 100%;
            text-align: center;
            color: #bb86fc; /* Cambiado a color morado */
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>Manos Do-Mi-Sol</h1>
        <h2>Creado por Manuel Puebla Vega</h2>
    </header>

    <div id="canvas-container">
        <div id="status-text">Cargando modelo y cámara...</div>
        <div id="hand-status">Esperando mano...</div>
    </div>
    
    <footer>
        <p>Todos los derechos reservados. Brotes Musicales ® 2025</p>
    </footer>

    <script>
        let handpose;
        let video;
        let predictions = [];
        let modelReady = false;

        let statusTextDiv, handStatusDiv;

        // --- Lógica de Audio ---
        let oscDo, oscSol, oscMi; // Añadido oscilador para Mi
        let lastState = null; // 'open', 'closed', 'peace', null
        const NOTE_DO = 261.63; // C4
        const NOTE_SOL = 392.00; // G4
        const NOTE_MI = 329.63; // E4 - Nueva nota

        function setup() {
            const canvasContainer = document.getElementById('canvas-container');
            const canvas = createCanvas(640, 480);
            canvas.parent('canvas-container');

            video = createCapture(VIDEO);
            video.size(width, height);
            video.hide();

            statusTextDiv = select('#status-text');
            handStatusDiv = select('#hand-status');

            handpose = ml5.handpose(video, () => {
                modelReady = true;
                statusTextDiv.html('¡Listo! Muestra tu mano.');
                setTimeout(() => {
                    statusTextDiv.style('opacity', '0');
                    statusTextDiv.style('z-index', '-1');
                }, 2000);
            });

            handpose.on('predict', results => {
                predictions = results;
            });

            setupAudio();
        }

        function setupAudio() {
            userStartAudio();

            oscDo = new p5.Oscillator('sine');
            oscDo.freq(NOTE_DO);
            oscDo.amp(0);
            oscDo.start();
            
            oscSol = new p5.Oscillator('sine');
            oscSol.freq(NOTE_SOL);
            oscSol.amp(0);
            oscSol.start();

            // Configurar el nuevo oscilador para Mi
            oscMi = new p5.Oscillator('sine');
            oscMi.freq(NOTE_MI);
            oscMi.amp(0);
            oscMi.start();
        }
        
        function draw() {
            translate(width, 0);
            scale(-1, 1);
            image(video, 0, 0, width, height);
            
            translate(width, 0);
            scale(-1, 1);

            if (modelReady) {
                drawKeypoints();
                analyzeHand();
            }
        }
        
        function analyzeHand() {
            let currentStatusText = "Esperando mano...";
            let currentState = null;

            if (predictions.length > 0) {
                const hand = predictions[0];
                const landmarks = hand.landmarks;
                
                const wrist = landmarks[0];
                
                const fingerTips = [landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
                const fingerMids = [landmarks[6], landmarks[10], landmarks[14], landmarks[18]];
                
                // Array para saber si cada dedo está abierto o cerrado
                let fingersOpen = [false, false, false, false];
                let closedFingersCount = 0;

                for (let i = 0; i < fingerTips.length; i++) {
                    const tip = fingerTips[i];
                    const mid = fingerMids[i];
                    
                    const distTipToWrist = dist(tip[0], tip[1], wrist[0], wrist[1]);
                    const distMidToWrist = dist(mid[0], mid[1], wrist[0], wrist[1]);

                    if (distTipToWrist > distMidToWrist) {
                        fingersOpen[i] = true;
                    } else {
                        closedFingersCount++;
                    }
                }

                // *** LÓGICA DE DETECCIÓN DE GESTOS ***
                // 1. Prioridad: Detectar gesto de "paz" (índice y corazón abiertos, resto cerrados)
                if (fingersOpen[0] && fingersOpen[1] && !fingersOpen[2] && !fingersOpen[3]) {
                    currentState = 'peace';
                    currentStatusText = 'Gesto de Paz: MI';
                } 
                // 2. Si no es paz, detectar mano cerrada
                else if (closedFingersCount >= 3) {
                    currentState = 'closed';
                    currentStatusText = 'Mano Cerrada: DO';
                } 
                // 3. Si no, es mano abierta
                else {
                    currentState = 'open';
                    currentStatusText = 'Mano Abierta: SOL';
                }

            } else {
                currentState = null;
                if (lastState !== null) {
                    updateSound(null);
                }
            }
            
            if (currentState !== lastState) {
                updateSound(currentState);
                lastState = currentState;
            }
            
            handStatusDiv.html(currentStatusText);
        }
        
        function updateSound(state) {
            const rampTime = 0.1; 

            // Apagar todos los osciladores antes de encender el correcto
            oscDo.amp(0, rampTime);
            oscSol.amp(0, rampTime);
            oscMi.amp(0, rampTime);

            if (state === 'closed') {
                oscDo.amp(0.5, rampTime);
            } else if (state === 'open') {
                oscSol.amp(0.5, rampTime);
            } else if (state === 'peace') {
                oscMi.amp(0.5, rampTime);
            }
        }

        function drawKeypoints() {
            for (let i = 0; i < predictions.length; i++) {
                const prediction = predictions[i];
                for (let j = 0; j < prediction.landmarks.length; j++) {
                    const keypoint = prediction.landmarks[j];
                    fill(187, 134, 252, 200);
                    noStroke();
                    ellipse(keypoint[0], keypoint[1], 10, 10);
                }
            }
        }
    </script>
</body>
</html>
