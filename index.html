<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manos Do y Sol</title>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #212529;
            --text-color: #f8f9fa;
            --primary-color: #0d6efd;
            --card-background: #343a40;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Para empujar el footer hacia abajo */
            min-height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            text-align: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: #adb5bd;
        }

        #video-container {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background-color: var(--card-background);
            width: 640px;
            height: 480px;
        }

        video {
            display: block; /* Elimina espacio extra debajo del video */
            transform: scaleX(-1); /* Espejo para que se sienta natural */
        }
        
        #status-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        #output, #note-output {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 400;
        }
        
        #start-button {
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        #start-button:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }
        
        #start-button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        footer {
            width: 100%;
            padding: 1rem;
            font-size: 0.9rem;
            color: #6c757d;
            background-color: #1a1e21;
        }
    </style>
</head>
<body>
    <main>
        <h1>Manos Do y Sol</h1>
        <p class="subtitle">Creado por Manuel Puebla Vega</p>

        <div id="video-container">
            <video id="video" width="640" height="480" autoplay muted playsinline></video>
            <div id="status-display">
                <div id="output">Esperando...</div>
                <div id="note-output">Nota: Silencio</div>
            </div>
        </div>
        
        <button id="start-button">Iniciar Detección</button>
    </main>

    <footer>
        Todos los derechos reservados. Brotes Musicales ® 2025
    </footer>

    <script>
        // --- Referencias a elementos del DOM ---
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const noteOutput = document.getElementById('note-output');
        const startButton = document.getElementById('start-button');

        // --- Variables Globales ---
        let handpose;
        let audioContext;
        let oscillator;
        let gainNode; // Para controlar el volumen y evitar clics
        let handClosed = false;
        let lastState = false;

        // --- Frecuencias de las notas ---
        const NOTE_C4 = 261.63; // Do
        const NOTE_G4 = 392.00; // Sol

        // --- Lógica Principal ---

        // Inicia la aplicación al hacer clic en el botón
        startButton.addEventListener('click', async () => {
            startButton.textContent = 'Cargando modelo...';
            startButton.disabled = true;

            await setupCamera();
            initAudio();
            
            // Inicializa ml5.handpose
            handpose = ml5.handpose(video, modelReady);
            
            // Escucha los eventos de 'predict'
            handpose.on('predict', gotHands);
        });

        // Configura la cámara del usuario
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
                startButton.textContent = "Error de Cámara";
            }
        }
        
        // Inicializa el Web Audio API de forma segura
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioContext.createOscillator();
                gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Inicia el oscilador pero con volumen 0
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                oscillator.start();
            }
        }

        // Se ejecuta cuando el modelo está listo
        function modelReady() {
            console.log("¡Modelo de Handpose cargado!");
            startButton.style.display = 'none'; // Oculta el botón
        }

        // Se ejecuta cada vez que se detectan manos
        function gotHands(results) {
            if (results.length > 0) {
                checkHandState(results[0]);
            } else {
                output.textContent = 'No se detecta mano';
                stopNote();
            }
        }
        
        // Comprueba si la mano está abierta o cerrada
        function checkHandState(hand) {
            // Puntos de referencia: 4 (punta del pulgar), 8 (punta del índice)
            const thumbTip = hand.landmarks[4];
            const indexTip = hand.landmarks[8];
            
            // Calcula la distancia euclidiana entre los dos puntos
            const distance = Math.hypot(thumbTip[0] - indexTip[0], thumbTip[1] - indexTip[1]);
            
            // Umbral para considerar la mano cerrada (ajustar si es necesario)
            const threshold = 60; 
            handClosed = distance < threshold;
            
            // Actualiza la nota solo si el estado ha cambiado para evitar repeticiones
            if (handClosed !== lastState) {
                if (handClosed) {
                    output.textContent = 'Mano cerrada';
                    playNote(NOTE_C4, 'Do');
                } else {
                    output.textContent = 'Mano abierta';
                    playNote(NOTE_G4, 'Sol');
                }
                lastState = handClosed;
            }
        }

        // Reproduce una nota con una transición suave
        function playNote(frequency, noteName) {
            if (!audioContext) return;
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.05); // Volumen a la mitad
            noteOutput.textContent = `Nota: ${noteName}`;
        }
        
        // Detiene la nota con una transición suave
        function stopNote() {
            if (!audioContext) return;
            gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.1);
            noteOutput.textContent = 'Nota: Silencio';
            lastState = null; // Resetea el estado para que suene al volver a detectar
        }

    </script>
</body>
</html>
